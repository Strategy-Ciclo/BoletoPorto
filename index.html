<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento de Boleto | Ciclo</title>
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --ciclo-navy: #283576;
            --ciclo-magenta: #EA0888;
            --ciclo-blue: #62C7F2;
            --ciclo-bg: #F4F6FB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chillax', sans-serif; }

        body {
            background-color: var(--ciclo-bg);
            color: var(--ciclo-navy);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(40, 53, 118, 0.08);
            text-align: center;
        }

        .alert-toast {
            background-color: #E6F8F0;
            color: #0D6832;
            border: 1px solid #A3E6C0;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        .instruction-text {
            font-size: 15px;
            color: var(--ciclo-navy);
            margin-bottom: 16px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Campo de validação do CPF */
        .cpf-input {
            width: 120px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            border: 2px solid var(--ciclo-blue);
            border-radius: 10px;
            outline: none;
            margin-bottom: 16px;
            font-weight: bold;
            color: var(--ciclo-navy);
        }

        .error-msg {
            color: #d9534f;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            display: none;
        }

        .code-box {
            background: #F8FAFC;
            border: 1.5px dashed var(--ciclo-blue);
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            color: var(--ciclo-navy);
            word-break: break-all;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .btn-action {
            background-color: var(--ciclo-navy);
            color: #FFFFFF;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-action:hover { background-color: #1d2757; }

        .barcode-container {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #E2E8F0;
        }

        svg#barcode { max-width: 100%; height: auto; }

        /* Área do Boleto (escondida por padrão) */
        #boleto-content { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div id="alert-toast" class="alert-toast">
            ✅ Código copiado com sucesso!
        </div>

        <!-- ETAPA 1: Trava de Segurança (CPF) -->
        <div id="lock-screen">
            <p class="instruction-text">
                Por segurança, digite os <strong>3 primeiros dígitos do seu CPF</strong> para acessar o boleto:
            </p>
            <input type="tel" id="cpfInput" class="cpf-input" maxlength="3" placeholder="123" autocomplete="off" />
            <div id="errorMsg" class="error-msg">⚠️ Dígitos incorretos. Tente novamente.</div>
            <button class="btn-action" onclick="validarCPF()">Acessar Boleto</button>
        </div>

        <!-- ETAPA 2: Conteúdo do Boleto (Liberado após validação) -->
        <div id="boleto-content">
            <p class="instruction-text">
                Para realizar o pagamento, copie o código abaixo e cole no app do seu banco:
            </p>

            <div id="code-display" class="code-box">Carregando código...</div>

            <button class="btn-action" onclick="copiarCodigo()">Copiar código</button>

            <div class="barcode-container">
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idChave = urlParams.get('id');
        
        const codeDisplay = document.getElementById('code-display');
        const alertToast = document.getElementById('alert-toast');
        const errorMsg = document.getElementById('errorMsg');
        
        let dadosCliente = null;

        // Busca as informações do JSON na abertura da página
        if (idChave) {
            fetch('./dados.json')
                .then(response => response.json())
                .then(dados => {
                    if (dados[idChave]) {
                        dadosCliente = dados[idChave];
                    } else {
                        document.getElementById('lock-screen').innerHTML = "<p>Boleto não encontrado.</p>";
                    }
                })
                .catch(() => {
                    document.getElementById('lock-screen').innerHTML = "<p>Erro ao carregar os dados.</p>";
                });
        }

        // Valida se os 3 dígitos conferem
        function validarCPF() {
            const inputVal = document.getElementById('cpfInput').value.trim();
            
            if (dadosCliente && inputVal === dadosCliente.cpf) {
                // Sucesso: Esconde a trava e exibe o boleto
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('boleto-content').style.display = 'block';
                
                renderizarBoleto(dadosCliente.cod);
            } else {
                // Erro: Exibe mensagem de aviso
                errorMsg.style.display = 'block';
            }
        }

        function copiarCodigo() {
            if (!dadosCliente) return;
            
            navigator.clipboard.writeText(dadosCliente.cod).then(() => {
                alertToast.style.display = 'block';
                setTimeout(() => { alertToast.style.display = 'none'; }, 3000);
            });
        }

        function renderizarBoleto(codigo) {
            codeDisplay.innerText = codigo;

            JsBarcode("#barcode", codigo, {
                format: "CODE128",
                lineColor: "#283576",
                width: 2,
                height: 60,
                displayValue: false
            });

            // Executa a cópia automática assim que valida o CPF
            copiarCodigo();
        }
    </script>
</body>
</html>
